# Easy as Tuning — iOS build and TestFlight upload.
#
# This exists because there is no Mac. Xcode only runs on macOS and only Xcode
# can sign an iOS app, so the build happens on a hosted Mac and the signing
# certificates are fetched through an App Store Connect API key rather than
# created in a Keychain by hand. That key is the whole trick: it is generated
# on the web, and it is what makes a Windows-only setup possible at all.
#
# The three values that had to come from App Store Connect are filled in:
# the API key's name as saved in Codemagic, the app record's numeric Apple
# ID, and where to send the result. The bundle ID and the product ID are
# permanent and match what is registered.
# ---------------------------------------------------------------------------

workflows:
  ios-testflight:
    name: iOS / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: 'Easy as Tuning'

    environment:
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY, the RSA key the distribution
        # certificate is built on. The App Store Connect integration above
        # supplies the three API-key variables by itself but not this one,
        # because it is not Apple's to give: it is the private half of the
        # certificate, and whoever holds it is who can sign.
        - signing
      vars:
        BUNDLE_ID: 'com.easyastuning.app'
        XCODE_PROJECT: 'ios/App/App.xcodeproj'
        XCODE_SCHEME: 'App'
        APP_STORE_APPLE_ID: 6806842475
      node: 22
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Typecheck and run the pitch harness
        # Cheap, and it runs before anything expensive. A type error or a
        # broken detector should cost twenty seconds of a Mac, not ten minutes.
        script: |
          npm run typecheck
          npm test

      - name: Build the web app and copy it into the iOS project
        # cap sync regenerates capacitor.config.json from the installed
        # plugin packages, which does not include the one that lives in the
        # app target. Without the third line the StoreKit bridge is built,
        # signed and unreachable.
        script: |
          npm run build
          npx cap sync ios
          node scripts/register-app-plugins.mjs

      - name: Stamp the version and the build number
        # Written into the project file with sed rather than through agvtool.
        #
        # Info.plist holds $(MARKETING_VERSION) and $(CURRENT_PROJECT_VERSION),
        # so the values that matter are build settings and not plist entries,
        # and agvtool would want the project switched to apple-generic
        # versioning first. These two lines edit exactly the strings that are
        # in the file today.
        #
        # The build number has to rise on every upload. App Store Connect
        # rejects a duplicate outright, and it does it after the upload has
        # finished, so getting this wrong costs a whole build.
        script: |
          set -e
          # Fail here, loudly, rather than uploading build 1 forever. With the
          # placeholder left in, the lookup below just fails and every build
          # numbers itself 1 -- which works exactly once and is then rejected
          # after every upload, with nothing on screen explaining why.
          if [ "$APP_STORE_APPLE_ID" = "0000000000" ]; then
            echo "APP_STORE_APPLE_ID is still the placeholder. Put the app record's"
            echo "numeric Apple ID in codemagic.yaml (App Information > General)."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          # Digits only. An empty or chatty answer must become 0, not garbage
          # that $(( )) then refuses to add to.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -cd '0-9')
          BUILD=$(( ${LATEST:-0} + 1 ))
          echo "version $VERSION, build $BUILD (latest on TestFlight: ${LATEST:-none})"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $VERSION;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD;/g" "$XCODE_PROJECT/project.pbxproj"

      - name: Fetch or create the certificate and profile
        # The first build makes both, every later one finds them.
        #
        # This was `environment.ios_signing`, which reads better and cannot
        # work here: that block only *fetches* signing files that already
        # exist, and on a machine that has never run Xcode none ever has.
        # The first build failed with "No matching profiles found" for exactly
        # that reason. `--create` is the difference.
        #
        # Apple allows very few distribution certificates at once, so the key
        # is kept in a variable rather than generated per build: a fresh key
        # each time would mean a fresh certificate each time and the limit
        # reached within a handful of builds.
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the ipa
        # --project, not --workspace: Capacitor 8 resolves its native
        # dependencies through Swift Package Manager, so there is no CocoaPods
        # workspace and no pod install anywhere in this file.
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only. Nothing here submits to the App Store — that stays a
        # deliberate act performed in App Store Connect, because it starts a
        # review that takes a day or two and cannot be recalled casually.
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - jdcraven87@gmail.com
        notify:
          success: true
          failure: true
