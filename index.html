<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout run under the iPhone notch/home bar,
         which the CSS then pads back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0C0F" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="A precise chromatic tuner for guitar, bass, ukulele, banjo, mandolin and orchestral strings. Works offline."
    />

    <!-- iOS standalone / home-screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Easy as Tuning" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

    <title>Easy as Tuning</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Easy as Tuning needs JavaScript to analyse audio from your microphone.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
